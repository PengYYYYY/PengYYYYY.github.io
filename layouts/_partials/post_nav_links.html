{{- $pages := where site.RegularPages "Type" "in" site.Params.mainSections }}
{{- if and (gt (len $pages) 1) (in $pages . ) }}
<nav class="paginav">
  {{- with $pages.Next . }}
  <a class="prev" href="{{ partial "entry_permalink.html" . }}"{{ with .Params.redirect_url }} target="_blank" rel="noopener noreferrer"{{ end }}>
    <span class="title">« {{ i18n "prev_page" }}</span>
    <span>{{- .Name -}}</span>
  </a>
  {{- end }}
  {{- with $pages.Prev . }}
  <a class="next" href="{{ partial "entry_permalink.html" . }}"{{ with .Params.redirect_url }} target="_blank" rel="noopener noreferrer"{{ end }}>
    <span class="title">{{ i18n "next_page" }} »</span>
    <span>{{- .Name -}}</span>
  </a>
  {{- end }}
</nav>
{{- end }}
